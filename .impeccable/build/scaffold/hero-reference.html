<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: rava-living-system-d.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#ebe6e5}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-floating-navigation region chrome" data-region="floating-navigation"><!-- Pearl glass floating navigation bar with brand, links, platform trigger and primary action --></div>
  <div class="r-hero-headline region text" data-region="hero-headline"><!-- Three-line Persian flagship promise in a heavy display face --><p style="font-size:var(--r-hero-headline-font);font-family:var(--r-hero-headline-family),sans-serif;font-weight:var(--r-hero-headline-weight);line-height:1.05;margin:0">hero-headline</p></div>
  <div class="r-hero-deck region text" data-region="hero-deck"><!-- Concise Persian explanation of the managed website operating system --><p style="font-size:var(--r-hero-deck-font);line-height:1.05;margin:0">hero-deck</p></div>
  <div class="r-hero-actions region control" data-region="hero-actions"><!-- Compact tactile primary and secondary hero actions: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-actions); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-platform-mega-menu region chrome" data-region="platform-mega-menu"><!-- Layered glass mega menu grouping content, design and platform operations --></div>
  <div class="r-editor-shell region chrome" data-region="editor-shell"><!-- Perspective website editor shell with page tree, toolbar and editable canvas --></div>
  <figure class="r-editor-site-visual region plate" data-region="editor-site-visual"><img src="../../../assets/plates/editor-site-visual.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-responsive-device-preview region chrome" data-region="responsive-device-preview"><!-- Tablet and mobile device frames showing responsive versions of the same site --></div>
  <figure class="r-responsive-site-visual region plate" data-region="responsive-site-visual"><img src="../../../assets/plates/responsive-site-visual.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-release-state-rail region chrome" data-region="release-state-rail"><!-- Vertical draft, preview and published state rail with directional connectors --></div>
  <div class="r-cinematic-ground region chrome" data-region="cinematic-ground"><!-- Midnight product walkthrough ground with restrained luminous flow lines --></div>
  <div class="r-walkthrough-heading region text" data-region="walkthrough-heading"><!-- Persian heading introducing the RAVA operating journey --><p style="font-size:var(--r-walkthrough-heading-font);line-height:1.05;margin:0">walkthrough-heading</p></div>
  <div class="r-content-step region chrome" data-region="content-step"><!-- Numbered content step with content panel and concise supporting copy --></div>
  <div class="r-design-step region chrome" data-region="design-step"><!-- Numbered design step with modular tools and website composition panel --></div>
  <div class="r-preview-step region chrome" data-region="preview-step"><!-- Numbered preview step with responsive review frame and supporting copy --></div>
  <div class="r-publish-step region chrome" data-region="publish-step"><!-- Numbered publish step with verified release state and supporting copy --></div>
</main>
</body>
</html>
