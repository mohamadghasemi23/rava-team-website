name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - reboot/rava-v1-spec

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Git and runtime preflight
        run: |
          git status --short --branch
          git branch --show-current
          git log -1 --oneline
          node --version
          npm --version
          npx --version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit high severity dependencies
        run: npm audit --audit-level=high
      - name: Lint gate
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
