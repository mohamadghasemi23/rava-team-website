name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - reboot/rava-v1-spec

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit generated lockfile on reboot branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/reboot/rava-v1-spec'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Lock dependencies from successful CI build"
            git push
          fi
