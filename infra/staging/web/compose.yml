name: rava-web-staging

services:
  app:
    image: rava-web:${RAVA_IMAGE_TAG:?set RAVA_IMAGE_TAG}
    restart: unless-stopped
    environment:
      SUPABASE_INTERNAL_URL: http://supabase-envoy:8000
      NEXT_PUBLIC_SUPABASE_URL: ${STAGING_PUBLIC_ORIGIN:?set STAGING_PUBLIC_ORIGIN}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SITE_URL: ${STAGING_PUBLIC_ORIGIN:?set STAGING_PUBLIC_ORIGIN}
      RAVA_PUBLIC_SITE_HOSTNAME: ${RAVA_PUBLIC_SITE_HOSTNAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in the protected Staging AI environment file}
      RAVA_OPENAI_MODEL: ${RAVA_OPENAI_MODEL:?set RAVA_OPENAI_MODEL in the protected Staging AI environment file}
    networks: [web, supabase]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:19080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [web, supabase]
    read_only: true
    tmpfs:
      - /config:size=16m,mode=0700
      - /data:size=32m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD","wget","-q","--spider","http://127.0.0.1/_infra/health"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  web:
    internal: true
  supabase:
    external: true
    name: supabase_default
